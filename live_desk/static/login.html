<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><base href="__DASHBOARD_BASE_PATH__/"/><title>Kotak Neo · Live Dashboard Login</title><link rel="stylesheet" href="static/styles.css"/><style>body{display:grid;place-items:center}.login{width:min(420px,94vw);padding:27px;border:1px solid #314d68;background:#111f2f;border-radius:15px}.login h1{font-size:24px;margin:0}.login p{color:#a6b6ca;font-size:13px;line-height:1.5}.login label{display:block;margin:22px 0 8px;font-size:13px}.login input{width:100%;padding:13px;background:#0b1623;border:1px solid #4c6682;border-radius:8px;color:#fff}.login button{width:100%;margin-top:16px}</style></head><body><div class="login"><div class="logo"><div class="diamond">KN</div><div><h1>Live Kotak Neo</h1><small>Private broker monitoring and control</small></div></div><p>Real brokerage data only. Live orders require additional explicit per-session authorization.</p><form id="form"><label for="password">Dashboard password</label><input id="password" type="password" required autocomplete="current-password" minlength="12"/><button class="primary">Sign in</button></form><p id="error" class="negative" role="alert"></p></div><script>const basePath=new URL(document.baseURI).pathname.replace(/\/$/, '');const SEP=String.fromCharCode(47);const route=path=>basePath&&path.startsWith(basePath+SEP)?path:(basePath||'')+path;document.querySelector('#form').addEventListener('submit',async ev=>{ev.preventDefault();try{let r=await fetch(route("/api/auth/login"),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.querySelector('#password').value})});if(!r.ok)throw Error('Invalid login or service unavailable');window.location.assign(route('/'));}catch(e){document.querySelector('#error').textContent=e.message;}});</script></body></html>
