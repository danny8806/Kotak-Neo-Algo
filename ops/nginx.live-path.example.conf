# Example location block inside the existing HTTPS server block.
# Keep the prefix in the browser URL and strip it only when proxying upstream.
# Set DASHBOARD_BASE_PATH=/kotak-live in the live service environment.
location = /kotak-live { return 301 /kotak-live/; }

location ^~ /kotak-live/ {
    proxy_pass http://127.0.0.1:8010/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 75s;
    proxy_connect_timeout 10s;
    proxy_redirect off;
}
