# EXAMPLE ONLY. Do not install without a separately registered hostname,
# valid TLS certificate, explicit admin approval and an Nginx configuration test.
# The existing company Nginx site and old Sniper port 8004 must not be changed.
# Replace neo.example.com and certificate paths before enabling.
server {
    listen 443 ssl http2;
    server_name neo.example.com;

    ssl_certificate /etc/letsencrypt/live/neo.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/neo.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_read_timeout 65s;
        proxy_connect_timeout 10s;
    }

    location /ws {
        proxy_pass http://127.0.0.1:8010/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 75s;
    }
}

server {
    listen 80;
    server_name neo.example.com;
    return 301 https://$host$request_uri;
}
